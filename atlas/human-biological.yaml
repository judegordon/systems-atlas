id: human-biological
name: Human biological
definition: >
  The organised structures of the human organism, from cells to organ systems,
  and the stable functional organisation those structures enable, including the
  agreed terminologies that describe them.
inclusion:
  - anatomical structures and their standardised nomenclature
  - cellular and molecular organisation directly constituting tissues and organs
  - organ-system architecture
  - reference-atlas representations of the body that preserve structural mapping
exclusion:
  - text: institutions delivering healthcare
    goes_to: healthcare
  - text: technological tools used to measure or operate on biology
    goes_to: technological
    relation: instrumentation
  - text: normative judgements about life and health
    goes_to: ethics
    kind: lens
sources: []
boundary_cases: []
uncertainty:
  - >
    This division currently has nine children, against a stated bound of seven.
    Either the bound does not apply at L1, which needs an argument, or two of
    these are not siblings of the rest.
  - >
    The endocrine system is excluded from the nervous system but does not appear
    as a component here. It is either missing or absorbed into another component
    without that being stated.

