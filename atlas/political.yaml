id: political
name: Political
definition: >
  Institutions, authority relations and formal or informal decision structures
  that determine collective choices and the allocation of public power in a
  society.
inclusion:
  - entities that hold or compete for legitimate coercive authority
  - entities that make or authorise binding collective decisions
  - structures of representation and participation
  - structures of accountability and oversight of state power
exclusion:
  - text: individual motivations
    goes_to: incentives
    kind: lens
  - text: courts and legislation analysed as legal structures
    goes_to: legal
sources: []
boundary_cases:
  - >
    Institutions that both constrain power and apply legal rules are classified
    by primary analytic focus: political when analysing allocation, limitation
    or competition of authority; legal when analysing rule validity,
    interpretation or enforcement.
uncertainty:
  - >
    Same objection as the legal domain. Classification by analytic focus makes
    the same institution sit in two places depending on the question asked.
