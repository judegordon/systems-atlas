<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Verifying your email — Systems Atlas Project</title>
<meta name="description" content="Confirm your Systems Atlas email address.">
<meta name="theme-color" content="#101820">
<meta name="robots" content="noindex">
<link rel="canonical" href="https://systemsatlasproject.com/account/verify/">
<link rel="icon" href="/assets/favicon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="/assets/icon-128.png" sizes="128x128" type="image/png">
<link rel="apple-touch-icon" href="/assets/icon-180.png">
<link rel="stylesheet" href="/styles.css">
</head>
<body>

<!--#include masthead-->

<main id="main" class="field--paper doc">
  <div class="wrap">
    <div class="doc__inner">
      <p class="eyebrow"><span class="eyebrow__no">ACCOUNT</span> Verify</p>
      <h1>Verifying your email.</h1>
      <p class="form__message" id="form-message" role="status" aria-live="polite"></p>

      <div class="account-section js-hidden" id="after-verify">
        <p><a class="btn btn--primary" href="/account/">Sign in</a></p>
      </div>

      <div class="account-section js-hidden" id="after-fail">
        <p>Verification links work once and expire after 24 hours. If this one has been used or has run out, sign in and ask for another.</p>
        <p><a href="/account/">Sign in</a></p>
      </div>
    </div>
  </div>
</main>

<!--#include footer-->

<script type="module" src="/assets/js/verify.js"></script>
</body>
</html>
