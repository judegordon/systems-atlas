name: Validate atlas

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Check the atlas against its own rules
        run: npm run validate -- --stats
        continue-on-error: true
      - name: Build
        run: npm run build
